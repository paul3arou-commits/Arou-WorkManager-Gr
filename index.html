<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arou WorkManager GR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .dark .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-40 p-3">
    <div class="max-w-5xl mx-auto glass rounded-2xl shadow-lg border border-slate-200/50 dark:border-slate-700/50 p-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md">
          <i class="fa-solid fa-briefcase text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Arou WorkManager GR</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400">Local App Mode</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-amber-400">
          <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
        </button>
        <button onclick="openModal('job')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl font-medium text-xs flex items-center gap-1 shadow-md">
          <i class="fa-solid fa-plus"></i> Νέα
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 space-y-4">

    <!-- Period Selector -->
    <div class="flex items-center justify-between bg-white dark:bg-slate-800 p-2 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
      <span class="text-xs font-bold text-slate-500 dark:text-slate-400 pl-2">📊 ΣΥΝΟΨΗ:</span>
      <div class="flex items-center gap-1 text-xs font-medium">
        <button onclick="setPeriod('week')" id="btnPeriodWeek" class="px-3 py-1.5 rounded-xl border transition">🗓️ Εβδομάδα</button>
        <button onclick="setPeriod('month')" id="btnPeriodMonth" class="px-3 py-1.5 rounded-xl border transition">📅 Μήνας</button>
        <button onclick="setPeriod('all')" id="btnPeriodAll" class="px-3 py-1.5 rounded-xl border transition">🌐 Όλα</button>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div onclick="openBreakdownModal('paid')" class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm cursor-pointer hover:border-emerald-500 transition">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">
          <span>🟢 ΕΙΣΠΡΑΧΘΗΚΑΝ</span>
          <i class="fa-solid fa-circle-info text-emerald-500"></i>
        </div>
        <div id="statPaid" class="text-xl font-bold text-emerald-600 dark:text-emerald-400">0 €</div>
      </div>

      <div onclick="openBreakdownModal('unpaid')" class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm cursor-pointer hover:border-rose-500 transition">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">
          <span>🔴 ΜΑΣ ΧΡΩΣΤΑΝΕ</span>
          <i class="fa-solid fa-circle-info text-rose-500"></i>
        </div>
        <div id="statPending" class="text-xl font-bold text-rose-600 dark:text-rose-400">0 €</div>
      </div>

      <div onclick="openBreakdownModal('expense')" class="bg-amber-50 dark:bg-amber-950/30 p-3.5 rounded-2xl border border-amber-300 dark:border-amber-800 shadow-sm cursor-pointer hover:border-amber-500 transition">
        <div class="flex items-center justify-between text-xs font-semibold text-amber-700 dark:text-amber-400 mb-1">
          <span>🟡 ΕΞΟΔΑ</span>
          <i class="fa-solid fa-circle-info text-amber-500"></i>
        </div>
        <div id="statExpenses" class="text-xl font-bold text-amber-600 dark:text-amber-400">0 €</div>
      </div>

      <div onclick="openBreakdownModal('profit')" class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm cursor-pointer hover:border-blue-500 transition">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">
          <span>💎 ΚΕΡΔΟΣ</span>
          <i class="fa-solid fa-circle-info text-blue-500"></i>
        </div>
        <div id="statProfit" class="text-xl font-bold text-blue-600 dark:text-blue-400">0 €</div>
      </div>
    </div>

    <!-- Search & Filter -->
    <div class="space-y-2">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Αναζήτηση πελάτη, εργασίας, σημειώσεων..." 
               class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-medium">
        <button onclick="setFilter('all')" id="btnFilterAll" class="px-3 py-1.5 rounded-xl border bg-blue-600 text-white border-blue-600 whitespace-nowrap">Όλα</button>
        <button onclick="setFilter('pending')" id="btnFilterPending" class="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 whitespace-nowrap">Σε Αναμονή</button>
        <button onclick="setFilter('unpaid')" id="btnFilterUnpaid" class="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-rose-600 whitespace-nowrap">Οφειλές</button>
        <button onclick="setFilter('expense')" id="btnFilterExpense" class="px-3 py-1.5 rounded-xl border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-amber-600 whitespace-nowrap">Έξοδα</button>
      </div>
    </div>

    <!-- Grid View: Calendar & List -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- Calendar View -->
      <div class="lg:col-span-1 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 id="calendarMonth" class="font-bold text-slate-800 dark:text-slate-100"></h2>
          <div class="flex gap-1">
            <button onclick="prevMonth()" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="nextMonth()" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
          <div>ΔΕ</div><div>ΤΡ</div><div>ΤΕ</div><div>ΠΕ</div><div>ΠΑ</div><div>ΣΑ</div><div>ΚΥ</div>
        </div>

        <div id="calendarDays" class="grid grid-cols-7 gap-1 text-xs"></div>
      </div>

      <!-- Items List -->
      <div class="lg:col-span-2 space-y-3">
        <div id="itemsContainer" class="space-y-3"></div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar for Mobile -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 px-4 py-2">
    <div class="max-w-md mx-auto flex justify-between items-center text-xs font-medium text-slate-500 dark:text-slate-400">
      <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center gap-1 text-blue-600">
        <i class="fa-solid fa-house text-base"></i>
        <span>Αρχική</span>
      </button>
      <button onclick="openModal('job')" class="flex flex-col items-center gap-1">
        <i class="fa-solid fa-plus-circle text-base text-emerald-500"></i>
        <span>Εργασία</span>
      </button>
      <button onclick="openModal('expense')" class="flex flex-col items-center gap-1">
        <i class="fa-solid fa-receipt text-base text-amber-500"></i>
        <span>Έξοδο</span>
      </button>
    </div>
  </nav>

  <!-- Entry Modal -->
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-slate-800 dark:text-slate-100">Νέα Καταχώρηση</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="jobForm" onsubmit="saveJob(event)" class="p-4 space-y-3 text-sm overflow-y-auto">
        <input type="hidden" id="editId">
        
        <div>
          <label class="block font-medium mb-1">Τύπος Καταχώρησης</label>
          <select id="type" onchange="toggleFormMode()" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
            <option value="job">🛠️ Εργασία / Ραντεβού</option>
            <option value="expense">🟡 Έξοδο</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium mb-1">Ημερομηνία</label>
            <input type="date" id="date" required class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
          </div>
          <div>
            <label class="block font-medium mb-1" id="lblTitle">Πελάτης / Τίτλος</label>
            <input type="text" id="title" required placeholder="π.χ. Γιώργος Παπαδόπουλος" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
          </div>
        </div>

        <div id="jobFields" class="space-y-3">
          <div>
            <label class="block font-medium mb-1">📍 Διεύθυνση / Τοποθεσία (Google Maps)</label>
            <input type="text" id="location" placeholder="π.χ. Τσιμισκή 45, Θεσσαλονίκη" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-medium mb-1">Συνολικό Ποσό (€)</label>
              <input type="number" step="0.01" id="amount" placeholder="0.00" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
            </div>
            <div>
              <label class="block font-medium mb-1">Πληρώθηκε / Προκαταβολή (€)</label>
              <input type="number" step="0.01" id="paid" placeholder="0.00" class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
            </div>
          </div>
        </div>

        <!-- Dynamic Expense Section -->
        <div id="expenseFields" class="hidden space-y-3">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-2">
            <span class="font-bold text-amber-600 dark:text-amber-400">Λίστα Εξόδων</span>
            <button type="button" onclick="addExpenseSubItem()" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-lg font-medium shadow-sm">+ Προσθήκη Εξόδου</button>
          </div>

          <div id="expenseSubItemsList" class="space-y-2"></div>

          <div class="flex justify-between items-center p-2.5 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200 dark:border-amber-800">
            <span class="font-bold text-xs text-amber-800 dark:text-amber-300">ΣΥΝΟΛΟ ΕΞΟΔΩΝ:</span>
            <span id="expenseTotalCalculated" class="font-bold text-base text-amber-600 dark:text-amber-400">0.00 €</span>
          </div>
        </div>

        <div>
          <label class="block font-medium mb-1">Σημειώσεις / Λεπτομέρειες</label>
          <textarea id="notes" rows="2" placeholder="Σημειώσεις..." class="w-full p-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 font-medium">Ακύρωση</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-md">Αποθήκευση</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Breakdown Modal -->
  <div id="breakdownModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-lg overflow-hidden max-h-[85vh] flex flex-col">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
        <h3 id="breakdownTitle" class="font-bold text-slate-800 dark:text-slate-100">Αναλυτική Προβολή</h3>
        <button onclick="closeBreakdownModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="breakdownContent" class="p-4 space-y-3 overflow-y-auto text-sm"></div>
    </div>
  </div>

  <script>
    let jobs = JSON.parse(localStorage.getItem('arou_wm_jobs') || '[]');
    let currentFilter = 'all';
    let currentPeriod = 'month';
    let selectedDate = null;
    let currentDate = new Date();

    const categoryLabels = {
      fuel: '⛽ Βενζίνη / Καύσιμα',
      materials: '🧱 Υλικά / Εργαλεία',
      food: '🍕 Φαγητό',
      other: '🛠️ Άλλο / Μεροκάματο'
    };

    function init() {
      if (localStorage.getItem('arou_wm_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400';
      }
      setPeriod('month');
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('arou_wm_theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-lg';
    }

    function setFilter(filter) { currentFilter = filter; renderApp(); }

    function setPeriod(period) {
      currentPeriod = period;
      ['Week', 'Month', 'All'].forEach(p => {
        const btn = document.getElementById('btnPeriod' + p);
        if (p.toLowerCase() === period) {
          btn.className = 'px-3 py-1.5 rounded-xl border bg-blue-600 text-white border-blue-600 font-bold';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl border bg-slate-100 dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300';
        }
      });
      renderApp();
    }

    function isDateInPeriod(dateStr) {
      if (currentPeriod === 'all') return true;
      const d = new Date(dateStr);
      const now = new Date();

      if (currentPeriod === 'month') {
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }

      if (currentPeriod === 'week') {
        const firstDayOfWeek = new Date(now);
        const day = now.getDay() || 7;
        firstDayOfWeek.setDate(now.getDate() - day + 1);
        firstDayOfWeek.setHours(0,0,0,0);

        const lastDayOfWeek = new Date(firstDayOfWeek);
        lastDayOfWeek.setDate(firstDayOfWeek.getDate() + 6);
        lastDayOfWeek.setHours(23,59,59,999);

        return d >= firstDayOfWeek && d <= lastDayOfWeek;
      }
      return true;
    }

    function renderApp() {
      renderStats();
      renderCalendar();
      renderList();
    }

    function renderStats() {
      let paidTotal = 0, pendingTotal = 0, expenseTotal = 0;

      jobs.forEach(item => {
        if (isDateInPeriod(item.date)) {
          if (item.type === 'expense') {
            expenseTotal += Number(item.amount || 0);
          } else {
            const amt = Number(item.amount || 0);
            const pd = Number(item.paid || 0);
            paidTotal += pd;
            if (amt > pd) pendingTotal += (amt - pd);
          }
        }
      });

      document.getElementById('statPaid').innerText = paidTotal.toFixed(2) + ' €';
      document.getElementById('statPending').innerText = pendingTotal.toFixed(2) + ' €';
      document.getElementById('statExpenses').innerText = expenseTotal.toFixed(2) + ' €';
      document.getElementById('statProfit').innerText = (paidTotal - expenseTotal).toFixed(2) + ' €';
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const monthNames = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
      document.getElementById('calendarMonth').innerText = monthNames[month] + ' ' + year;

      let startingDay = firstDay.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';

      for (let i = 0; i < startingDay; i++) {
        calendarDays.innerHTML += '<div></div>';
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayJobs = jobs.filter(j => j.date === dateStr);
        const hasExpenses = dayJobs.some(j => j.type === 'expense');
        const hasUnpaid = dayJobs.some(j => j.type !== 'expense' && Number(j.amount) > Number(j.paid));

        let bg = 'hover:bg-slate-100 dark:hover:bg-slate-700';
        if (selectedDate === dateStr) bg = 'bg-blue-600 text-white font-bold';

        calendarDays.innerHTML += `
          <div onclick="selectCalendarDate('${dateStr}')" class="p-2 rounded-xl text-center cursor-pointer relative transition ${bg}">
            ${day}
            ${dayJobs.length > 0 ? `
              <div class="flex justify-center gap-0.5 mt-1">
                ${hasExpenses ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>' : ''}
                ${hasUnpaid ? '<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>' : ''}
              </div>
            ` : ''}
          </div>
        `;
      }
    }

    function selectCalendarDate(dateStr) {
      selectedDate = dateStr;
      openModal('job', dateStr);
    }

    function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderApp(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderApp(); }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      let filtered = jobs.filter(j => {
        if (!isDateInPeriod(j.date)) return false;

        const matchesSearch = j.title.toLowerCase().includes(search) || 
                              (j.notes && j.notes.toLowerCase().includes(search)) ||
                              (j.location && j.location.toLowerCase().includes(search));

        if (!matchesSearch) return false;

        if (currentFilter === 'pending') return j.type !== 'expense' && Number(j.amount) > Number(j.paid);
        if (currentFilter === 'unpaid') return j.type !== 'expense' && Number(j.amount) > Number(j.paid);
        if (currentFilter === 'expense') return j.type === 'expense';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-400">Δεν βρέθηκαν καταχωρήσεις</div>';
        return;
      }

      filtered.forEach(item => {
        const isExpense = item.type === 'expense';
        const isUnpaid = !isExpense && Number(item.amount) > Number(item.paid);

        let subItemsHTML = '';
        if (isExpense && item.subItems && item.subItems.length > 0) {
          subItemsHTML = `
            <div class="mt-2 pt-2 border-t border-amber-200 dark:border-amber-900/50 space-y-1">
              ${item.subItems.map(sub => `
                <div class="flex justify-between items-center text-xs text-slate-600 dark:text-slate-300">
                  <span>${categoryLabels[sub.category] \vert{}\vert{} '🟡 Έξοδο'}: <strong>${sub.desc}</strong></span>
                  <span class="font-bold">${Number(sub.amount).toFixed(2)} €</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        container.innerHTML += `
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border ${isExpense ? 'border-amber-300 dark:border-amber-800 bg-amber-50/30' : 'border-slate-200 dark:border-slate-700'} shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs px-2 py-0.5 rounded-md font-semibold ${isExpense ? 'bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300' : 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300'}">
                  ${isExpense ? '🟡 ΣΥΝΟΛΟ ΕΞΟΔΩΝ' : '🛠️ ΕΡΓΑΣΙΑ'}
                </span>
                <h3 class="font-bold text-base mt-1">${item.title}</h3>
                <p class="text-xs text-slate-400">${item.date}</p>
              </div>
              <div class="text-right">
                <div class="font-bold text-lg ${isExpense ? 'text-amber-600 dark:text-amber-400' : 'text-slate-800 dark:text-slate-100'}">
                  ${Number(item.amount).toFixed(2)} €
                </div>
                ${!isExpense ? `<div class="text-xs font-semibold ${isUnpaid ? 'text-rose-500' : 'text-emerald-500'}">${isUnpaid ? 'Οφειλή: ' + (item.amount - item.paid).toFixed(2) + ' €' : 'Εξοφλήθη'}</div>` : ''}
              </div>
            </div>

            ${item.location ? `
              <div class="pt-1">
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 font-semibold hover:underline bg-emerald-50 dark:bg-emerald-950/40 px-2.5 py-1 rounded-lg">
                  <i class="fa-solid fa-location-dot"></i> 📍 Google Maps: ${item.location}
                </a>
              </div>
            ` : ''}

            ${subItemsHTML}

            ${item.notes ? `<p class="text-xs text-slate-600 dark:text-slate-400 border-t border-slate-100 dark:border-slate-700/50 pt-2">${item.notes}</p>` : ''}

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-700/50">
              <button onclick="editJob('${item.id}')" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-pen"></i> Επεξεργασία</button>
              <button onclick="deleteJob('${item.id}')" class="text-xs px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-600"><i class="fa-solid fa-trash"></i> Διαγραφή</button>
            </div>
          </div>
        `;
      });
    }

    function openModal(defaultType = 'job', date = null) {
      document.getElementById('jobForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('modalTitle').innerText = defaultType === 'expense' ? 'Νέο Έξοδο' : 'Νέα Εργασία';
      document.getElementById('type').value = defaultType;
      document.getElementById('date').value = date || new Date().toISOString().split('T')[0];
      document.getElementById('expenseSubItemsList').innerHTML = '';
      toggleFormMode();
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    function toggleFormMode() {
      const isExpense = document.getElementById('type').value === 'expense';
      document.getElementById('jobFields').style.display = isExpense ? 'none' : 'block';
      document.getElementById('expenseFields').style.display = isExpense ? 'block' : 'none';
      document.getElementById('lblTitle').innerText = isExpense ? 'Τίτλος Εξόδων / Ημέρας' : 'Πελάτης / Τίτλος';

      if (isExpense && document.getElementById('expenseSubItemsList').children.length === 0) {
        addExpenseSubItem();
      }
    }

    function addExpenseSubItem(category = 'fuel', desc = '', amount = '') {
      const container = document.getElementById('expenseSubItemsList');
      const div = document.createElement('div');
      div.className = 'expense-row grid grid-cols-12 gap-1.5 items-center bg-slate-50 dark:bg-slate-700/40 p-2 rounded-xl border border-slate-200 dark:border-slate-700';
      div.innerHTML = `
        <div class="col-span-4">
          <select class="sub-category w-full p-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800">
            <option value="fuel" ${category==='fuel'?'selected':''}>⛽ Βενζίνη</option>
            <option value="food" ${category==='food'?'selected':''}>🍕 Φαγητό</option>
            <option value="materials" ${category==='materials'?'selected':''}>🧱 Υλικά</option>
            <option value="other" ${category==='other'?'selected':''}>🛠️ Άλλο</option>
          </select>
        </div>
        <div class="col-span-4">
          <input type="text" value="${desc}" placeholder="Περιγραφή" class="sub-desc w-full p-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800">
        </div>
        <div class="col-span-3">
          <input type="number" step="0.01" value="${amount}" oninput="calcExpenseTotal()" placeholder="Ποσό (€)" class="sub-amount w-full p-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800">
        </div>
        <div class="col-span-1 text-center">
          <button type="button" onclick="removeExpenseSubItem(this)" class="text-rose-500 text-sm"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      container.appendChild(div);
      calcExpenseTotal();
    }

    function removeExpenseSubItem(btn) {
      btn.closest('.expense-row').remove();
      calcExpenseTotal();
    }

    function calcExpenseTotal() {
      let total = 0;
      document.querySelectorAll('.sub-amount').forEach(inp => {
        total += Number(inp.value || 0);
      });
      document.getElementById('expenseTotalCalculated').innerText = total.toFixed(2) + ' €';
    }

    function saveJob(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value || Date.now().toString();
      const type = document.getElementById('type').value;
      const isExpense = type === 'expense';

      let totalAmount = 0;
      let subItems = [];

      if (isExpense) {
        document.querySelectorAll('.expense-row').forEach(row => {
          const cat = row.querySelector('.sub-category').value;
          const desc = row.querySelector('.sub-desc').value;
          const amt = Number(row.querySelector('.sub-amount').value || 0);
          if (amt > 0) {
            subItems.push({ category: cat, desc, amount: amt });
            totalAmount += amt;
          }
        });
      } else {
        totalAmount = Number(document.getElementById('amount').value || 0);
      }

      const jobData = {
        id,
        type,
        date: document.getElementById('date').value,
        title: document.getElementById('title').value,
        location: isExpense ? '' : document.getElementById('location').value,
        amount: totalAmount,
        paid: isExpense ? 0 : Number(document.getElementById('paid').value || 0),
        notes: document.getElementById('notes').value,
        subItems: isExpense ? subItems : []
      };

      const idx = jobs.findIndex(j => j.id === id);
      if (idx > -1) jobs[idx] = jobData;
      else jobs.push(jobData);

      localStorage.setItem('arou_wm_jobs', JSON.stringify(jobs));
      closeModal();
      renderApp();
    }

    function editJob(id) {
      const item = jobs.find(j => j.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('type').value = item.type || 'job';
      toggleFormMode();

      document.getElementById('date').value = item.date;
      document.getElementById('title').value = item.title;
      document.getElementById('location').value = item.location || '';
      document.getElementById('amount').value = item.amount;
      document.getElementById('paid').value = item.paid;
      document.getElementById('notes').value = item.notes || '';

      if (item.type === 'expense' && item.subItems) {
        const container = document.getElementById('expenseSubItemsList');
        container.innerHTML = '';
        item.subItems.forEach(s => addExpenseSubItem(s.category, s.desc, s.amount));
      }

      document.getElementById('modalTitle').innerText = 'Επεξεργασία';
      document.getElementById('modal').classList.remove('hidden');
    }

    function deleteJob(id) {
      if (confirm('Θέλετε να διαγράψετε αυτή την καταχώρηση;')) {
        jobs = jobs.filter(j => j.id !== id);
        localStorage.setItem('arou_wm_jobs', JSON.stringify(jobs));
        renderApp();
      }
    }

    function openBreakdownModal(type) {
      const content = document.getElementById('breakdownContent');
      content.innerHTML = '';

      let titleText = '';
      let list = [];

      if (type === 'paid') {
        titleText = '🟢 Αναλυτικά Εισπράξεις';
        jobs.filter(j => isDateInPeriod(j.date) && j.type !== 'expense' && j.paid > 0).forEach(j => {
          list.push(`<div class="flex justify-between p-2.5 bg-emerald-50 dark:bg-emerald-950/40 rounded-xl border border-emerald-200 dark:border-emerald-800">
            <div><div class="font-bold">${j.title}</div><div class="text-xs text-slate-400">${j.date}</div></div>
            <div class="font-bold text-emerald-600 dark:text-emerald-400">+ ${Number(j.paid).toFixed(2)} €</div>
          </div>`);
        });
      } else if (type === 'unpaid') {
        titleText = '🔴 Αναλυτικά Οφειλές (Μας Χρωστάνε)';
        jobs.filter(j => isDateInPeriod(j.date) && j.type !== 'expense' && j.amount > j.paid).forEach(j => {
          const unpaid = j.amount - j.paid;
          list.push(`<div class="flex justify-between p-2.5 bg-rose-50 dark:bg-rose-950/40 rounded-xl border border-rose-200 dark:border-rose-800">
            <div><div class="font-bold">${j.title}</div><div class="text-xs text-slate-400">${j.date}</div></div>
            <div class="font-bold text-rose-600 dark:text-rose-400">${Number(unpaid).toFixed(2)} €</div>
          </div>`);
        });
      } else if (type === 'expense') {
        titleText = '🟡 Αναλυτικά Έξοδα';
        list.push(`<div class="flex justify-end pb-2">
          <button onclick="closeBreakdownModal(); openModal('expense')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold">+ Νέο Έξοδο</button>
        </div>`);

        let cats = { fuel: 0, food: 0, materials: 0, other: 0 };
        jobs.filter(j => isDateInPeriod(j.date) && j.type === 'expense').forEach(j => {
          if (j.subItems && j.subItems.length > 0) {
            j.subItems.forEach(s => cats[s.category] = (cats[s.category] || 0) + Number(s.amount));
          } else {
            cats.other += Number(j.amount);
          }
        });

        Object.keys(cats).forEach(k => {
          if (cats[k] > 0) {
            list.push(`<div class="flex justify-between p-2.5 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200 dark:border-amber-800">
              <span class="font-bold">${categoryLabels[k]}</span>
              <span class="font-bold text-amber-600 dark:text-amber-400">${cats[k].toFixed(2)} €</span>
            </div>`);
          }
        });
      } else if (type === 'profit') {
        titleText = '💎 Υπολογισμός Κέρδους';
        let paid = 0, exp = 0;
        jobs.filter(j => isDateInPeriod(j.date)).forEach(j => {
          if (j.type === 'expense') exp += Number(j.amount);
          else paid += Number(j.paid);
        });
        list.push(`
          <div class="space-y-2">
            <div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Εισπράξεις:</span><span class="font-bold text-emerald-500">+ ${paid.toFixed(2)} €</span></div>
            <div class="flex justify-between text-slate-600 dark:text-slate-300"><span>Έξοδα:</span><span class="font-bold text-amber-500">- ${exp.toFixed(2)} €</span></div>
            <div class="flex justify-between pt-2 border-t border-slate-200 dark:border-slate-700 text-base font-bold"><span>Καθαρό Κέρδος:</span><span class="text-blue-600 dark:text-blue-400">${(paid - exp).toFixed(2)} €</span></div>
          </div>
        `);
      }

      document.getElementById('breakdownTitle').innerText = titleText;
      content.innerHTML = list.length > 0 ? list.join('') : '<div class="text-center text-slate-400 py-4">Δεν υπάρχουν δεδομένα</div>';
      document.getElementById('breakdownModal').classList.remove('hidden');
    }

    function closeBreakdownModal() { document.getElementById('breakdownModal').classList.add('hidden'); }

    init();
  </script>
</body>
</html>
